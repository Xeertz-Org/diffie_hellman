documentation: https://xeertz.com/diffie-hellman

environment:
  sdk: ^3.6.2

dependencies:
  meta: ^1.16.0
  equatable: ^2.0.7
  asn1lib: ^1.5.9

dev_dependencies:
  lints: ^5.1.1
  flutter_lints: ^5.0.0
  test: ^1.25.2